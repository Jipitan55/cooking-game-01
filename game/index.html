<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sizzle &amp; Serve — The Golden Ladle</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1d16; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; cursor: pointer; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Touch controls: built by touch.js only on touch devices (never in ?shot= mode). */
  #touch-ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: none; }
  #touch-ui.on { display: block; }
  #touch-ui .tbtn {
    pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; font-family: "Trebuchet MS", Verdana, sans-serif;
    color: #fff; background: rgba(43,29,22,0.55); border: 2px solid rgba(255,255,255,0.65);
    padding: 0; cursor: pointer;
  }
  #touch-ui .tbtn:active { background: rgba(255,213,79,0.8); color: #4e342e; }
  #dpad {
    position: absolute; left: 8px; bottom: 10px; width: var(--pad, 120px); height: var(--pad, 120px);
    display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 3px;
  }
  #dpad .dir { border-radius: 10px; font-size: 20px; line-height: 1; }
  #dpad .up { grid-area: 1 / 2; }
  #dpad .left { grid-area: 2 / 1; }
  #dpad .right { grid-area: 2 / 3; }
  #dpad .down { grid-area: 3 / 2; }
  #btn-use {
    position: absolute; right: 8px; bottom: 12px; width: var(--use, 78px); height: var(--use, 78px);
    border-radius: 50%; font-size: 18px; font-weight: bold;
  }
  #btn-pause, #btn-mute {
    position: absolute; top: 10px; width: 42px; height: 42px;
    border-radius: 50%; font-size: 16px; font-weight: bold;
  }
  #btn-pause { right: 58px; }
  #btn-mute { right: 8px; }
  #rotate-hint {
    display: none; position: absolute; inset: 0; pointer-events: auto;
    background: rgba(43,29,22,0.93); color: #fff8e1;
    align-items: center; justify-content: center; text-align: center;
    font-family: "Trebuchet MS", Verdana, sans-serif; font-size: 20px; line-height: 1.5;
  }
  @media (orientation: portrait) { #rotate-hint { display: flex; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Sizzle and Serve: run the Golden Ladle bistro kitchen, take orders, chop, cook, plate and serve dishes before patience runs out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
